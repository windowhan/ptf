[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "distributed-runtime"
version = "0.1.0"
description = "Domain-neutral contracts for finite and continuous distributed workloads"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
gcp = []
testing = []

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "coverage>=7.6,<8",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["distributed_runtime"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = [
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["distributed_runtime"]
